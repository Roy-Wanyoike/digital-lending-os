<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  @page { size: 794px 1123px; margin: 0; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 794px; height: 1123px; margin: 0; padding: 0; background: #f8f9fc; font-family: 'Inter', sans-serif; overflow: hidden; }

  .cover-page {
    position: relative;
    width: 794px;
    height: 1123px;
    background: #f8f9fc;
  }

  /* Layer 1: Grid pattern + deep-space arc (Recipe A) */
  .bg-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,42,74,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,42,74,0.02) 1px, transparent 1px);
    background-size: 67px 67px;
  }
  .bg-arc {
    position: absolute;
    width: 1032px;
    height: 1032px;
    border-radius: 50%;
    background: rgba(30,42,74,0.03);
    left: 794px;
    bottom: -206px;
  }

  /* Layer 2: Left anchor line */
  .structure-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .anchor-line {
    position: absolute;
    left: 95px;
    top: 112px;
    width: 8px;
    height: 899px;
    background: #1e2a4a;
    border-radius: 4px;
  }

  /* Layer 3: Content */
  .content-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .kicker {
    position: absolute;
    left: 135px;
    top: 168px;
    font-family: 'Inter', sans-serif;
    font-size: 21pt;
    font-weight: 400;
    letter-spacing: 4pt;
    text-transform: uppercase;
    color: #1e2a4a;
    opacity: 0.6;
    max-width: 580px;
  }
  .hero-title {
    position: absolute;
    left: 135px;
    top: 337px;
    font-family: 'Playfair Display', serif;
    font-size: 69pt;
    font-weight: 900;
    line-height: 1.1;
    color: #1e2a4a;
    max-width: 666px;
    letter-spacing: -0.5pt;
  }
  .summary {
    position: absolute;
    left: 135px;
    top: 562px;
    font-family: 'Inter', sans-serif;
    font-size: 21pt;
    font-weight: 400;
    line-height: 1.6;
    color: #1a1a2e;
    opacity: 0.85;
    max-width: 476px;
  }
  .meta {
    position: absolute;
    left: 135px;
    top: 843px;
    font-family: 'Inter', sans-serif;
    font-size: 21pt;
    font-weight: 400;
    color: #1a1a2e;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="cover-page">
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-arc"></div>
  </div>
  <div class="structure-layer">
    <div class="anchor-line"></div>
  </div>
  <div class="content-layer">
    <div class="kicker">WHITE PAPER</div>
    <div class="hero-title">YOUNGSEND</div>
    <div class="summary">The Financial Operating System and Trust Network for Global Commerce. A comprehensive platform enabling any two verified parties, anywhere in the world, to transact with confidence.</div>
    <div class="meta">Young Shark Technologies | 2025</div>
  </div>
</div>
</body>
</html>
