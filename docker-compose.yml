# ─────────────────────────────────────────────────────────────────────
# Youngsend — Local Development Stack
# Usage: docker compose up -d
# ─────────────────────────────────────────────────────────────────────
# NOTE: This app uses SQLite (file:./db/custom.db), not PostgreSQL.
#       The db/ directory is bind-mounted so data persists across restarts.
# ─────────────────────────────────────────────────────────────────────

services:
  # ── Next.js Application ────────────────────────────────────────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youngsend-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      # Persist SQLite database file across container rebuilds
      - ./db:/app/db
    networks:
      - youngsend-net
    restart: unless-stopped

  # ── Redis 7 (optional cache) ──────────────────────────────────────
  # The app falls back to an in-memory LRU cache when Redis is unavailable,
  # but running Redis gives you proper TTL expiry, pub/sub, and rate-limiting.
  redis:
    image: redis:7-alpine
    container_name: youngsend-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - youngsend-net
    restart: unless-stopped

volumes:
  redisdata:
    driver: local

networks:
  youngsend-net:
    driver: bridge
