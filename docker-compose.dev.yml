# ─────────────────────────────────────────────────────────────────────
# Digital Lending OS — Docker Compose Dev Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://digital-lending-os:digital-lending-os@postgres:5432/digital_lending_os
      - DIRECT_URL=postgresql://digital-lending-os:digital-lending-os@postgres:5432/digital_lending_os
    volumes:
      # Hot-reload: mount source so file-watcher picks up changes
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
