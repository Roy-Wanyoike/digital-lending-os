# Youngsend — Continuous Integration
# Triggers on push/PR to main branch.
# Pipeline: checkout → deps → lint → type-check → test → build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Type-Check · Test · Build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── Dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Lint ───────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Type-check (fail fast) ─────────────────────────────────
      - name: Type-check
        run: npx tsc --noEmit --pretty

      # ── Test ───────────────────────────────────────────────────
      - name: Test
        run: npx vitest run --reporter=verbose
        env:
          DATABASE_URL: "file:./db/custom.db"
          NODE_ENV: test

      # ── Build ──────────────────────────────────────────────────
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./db/custom.db"
          NEXTAUTH_SECRET: "ci-test-secret-not-for-production"
          NEXT_TELEMETRY_DISABLED: "1"
