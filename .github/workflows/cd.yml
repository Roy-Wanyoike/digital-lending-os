# Youngsend — Continuous Deployment to GKE
# Triggers on push to main (after CI passes in a separate workflow run).
# Pipeline: checkout → build & push to GCR → deploy to GKE → verify rollout

name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'YOUR_PROJECT_ID' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  IMAGE_NAME: gcr.io/${{ vars.GCP_PROJECT_ID || 'YOUR_PROJECT_ID' }}/youngsend

jobs:
  # ── Build & Push ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker Buildx ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GCP Auth ──────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      # ── Build & Push ──────────────────────────────────────────
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

  # ── Deploy ────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── GCP Auth ──────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Get GKE Credentials ───────────────────────────────────
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "youngsend-prod" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}"

      # ── Deploy Manifests ───────────────────────────────────────
      - name: Apply K8s manifests with image tag
        run: |
          export IMAGE_TAG=${{ github.sha }}
          export PROJECT_ID=${{ env.PROJECT_ID }}

          # Replace placeholders in all K8s manifests
          for file in infra/k8s/*.yaml; do
            envsubst < "$file" | kubectl apply -f -
          done

      # ── Rollout Verification ───────────────────────────────────
      - name: Verify rollout
        run: |
          kubectl rollout status deployment/youngsend-nextjs \
            -n youngsend-prod \
            --timeout=300s
