# Youngsend Docker Build & Push
# Multi-platform images (amd64 + arm64) with SBOM generation
# Pushes to ghcr.io/youngsend/youngsend

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/youngsend/youngsend

jobs:
  build-and-push:
    name: Build & Push Multi-Platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TAGS="${{ env.IMAGE_NAME }}:sha-${SHA_SHORT}"

          # Push :latest on main branch
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi

          # Push version tag on v* tags
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Building tags: ${TAGS}"

      - name: Build and push (multi-platform)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
          sbom: true

      - name: Generate SBOM attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
        continue-on-error: true

      - name: Verify multi-platform images
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)