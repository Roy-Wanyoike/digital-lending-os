# PR Preview Deployment
# Deploys preview environment for each pull request

name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

jobs:
  # Build and deploy preview
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'deploy-preview') ||
      github.event.action != 'labeled'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --quiet || echo "Linting warnings detected"

      - name: Build application
        id: build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Create deployment status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `preview-pr-${context.payload.pull_request.number}`,
              auto_merge: false,
              description: `Preview for PR #${context.payload.pull_request.number}`,
              required_contexts: [],
              transient_environment: true,
              production_environment: false
            });
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId.data.id,
              state: 'success',
              environment_url: `${context.server_url}/${context.repo.owner}/${context.repo.repo}/pull/${context.payload.pull_request.number}`,
              description: 'Preview build completed successfully',
              auto_inactive: true
            });
            
            return deploymentId.data.id;

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const commentBody = `## 🚀 Preview Deployment
            
            | Detail | Value |
            |--------|-------|
            | **Status** | ✅ Ready |
            | **Branch** | \`${context.payload.pull_request.head.ref}\` |
            | **Commit** | \`${context.sha.substring(0, 7)}\` |
            
            ### Links
            - 🔍 [View Changes](${context.server_url}/${context.repo.owner}/${context.repo.repo}/pull/${prNumber})
            - 📦 [Build Artifacts](actions/runs/${context.runId})
            
            ---
            *Preview deployed automatically by GitHub Actions*
            *This preview will be updated on each push to this PR*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Preview Deployment')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

      - name: Upload preview artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-${{ github.event.pull_request.number }}
          path: .next/
          retention-days: 5

  # Cleanup preview when PR is closed
  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deploymentId = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: `preview-pr-${context.payload.pull_request.number}`,
                auto_merge: false,
                state: 'inactive',
                description: 'Preview closed - cleaning up',
                required_contexts: []
              });
              
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId.data.id,
                state: 'inactive',
                description: 'Preview environment removed',
                environment_url: ''
              });
            } catch (error) {
              console.log('Cleanup note:', error.message);
            }

      - name: Comment cleanup notice
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `## 🧹 Preview Cleaned Up
            
            The preview environment for this PR has been removed.
            
            Thank you for your contribution! 👏
            
            ---
            *Automated cleanup by GitHub Actions*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody
            });
