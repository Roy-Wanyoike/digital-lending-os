name: PR Checks

on:
  pull_request:

jobs:
  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Lint
        id: lint
        run: |
          npm run lint 2>&1 | tee lint-output.txt
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

      - name: Typecheck
        id: typecheck
        run: |
          npx tsc --noEmit 2>&1 | tee typecheck-output.txt
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

      - name: Test
        id: test
        run: |
          npm test 2>&1 | tee test-output.txt
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const lintOutput = fs.readFileSync('lint-output.txt', 'utf8').trim();
            const typecheckOutput = fs.readFileSync('typecheck-output.txt', 'utf8').trim();
            const testOutput = fs.readFileSync('test-output.txt', 'utf8').trim();

            const body = [
              '### PR Check Results',
              '',
              '<details><summary><strong>Lint</strong></summary>',
              '```',
              lintOutput.substring(0, 5000),
              lintOutput.length > 5000 ? '\n... (truncated)' : '',
              '```',
              '</details>',
              '',
              '<details><summary><strong>Typecheck</strong></summary>',
              '```',
              typecheckOutput.substring(0, 5000),
              typecheckOutput.length > 5000 ? '\n... (truncated)' : '',
              '```',
              '</details>',
              '',
              '<details><summary><strong>Test</strong></summary>',
              '```',
              testOutput.substring(0, 5000),
              testOutput.length > 5000 ? '\n... (truncated)' : '',
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
