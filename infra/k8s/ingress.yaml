# Digital Lending OS Ingress — nginx ingress class with TLS and rate limiting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-lending-os-ingress
  namespace: digital-lending-os
  labels:
    app: digital-lending-os
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - digital-lending-os.space-z.ai
      secretName: digital-lending-os-tls
  rules:
    - host: digital-lending-os.space-z.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-lending-os-svc
                port:
                  number: 80
