# Youngsend Ingress — nginx ingress class with TLS and rate limiting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: youngsend-ingress
  namespace: youngsend
  labels:
    app: youngsend
    app.kubernetes.io/name: youngsend
    app.kubernetes.io/part-of: youngsend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - youngsend.space-z.ai
      secretName: youngsend-tls
  rules:
    - host: youngsend.space-z.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: youngsend-svc
                port:
                  number: 80
