# Youngsend Horizontal Pod Autoscaler
# Dual-metric CPU + Memory with scale-up/down behavior tuning
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: youngsend-hpa
  namespace: youngsend
  labels:
    app: youngsend
    app.kubernetes.io/name: youngsend
    app.kubernetes.io/part-of: youngsend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: youngsend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min
