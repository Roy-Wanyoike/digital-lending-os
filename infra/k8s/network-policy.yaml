# Digital Lending OS Network Policies
# Default deny-all with selective allow rules for ingress and egress

---
# Default deny all ingress and egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from ingress-nginx namespace on port 3000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# Allow egress to PostgreSQL on port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-postgresql
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Allow egress to Redis on port 6379
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-redis
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# Allow egress to Kafka on port 9092
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-kafka
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Allow egress to OpenSearch on port 9200
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-opensearch
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
---
# Allow egress to OTel Collector on port 4317
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel-collector
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector:
    matchLabels:
      app: digital-lending-os
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
---
# Allow DNS egress for all pods (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
