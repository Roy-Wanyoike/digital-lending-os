# Digital Lending OS Service — ClusterIP exposing port 80 → container port 3000
apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-svc
  namespace: digital-lending-os
  labels:
    app: digital-lending-os
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: digital-lending-os
