# Youngsend Service — ClusterIP exposing port 80 → container port 3000
apiVersion: v1
kind: Service
metadata:
  name: youngsend-svc
  namespace: youngsend
  labels:
    app: youngsend
    app.kubernetes.io/name: youngsend
    app.kubernetes.io/part-of: youngsend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: youngsend
