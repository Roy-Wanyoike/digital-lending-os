# Digital Lending OS Kustomization
# Lists all resources in dependency order for kubectl apply -k
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: digital-lending-os

commonLabels:
  app.kubernetes.io/name: digital-lending-os
  app.kubernetes.io/part-of: digital-lending-os

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
