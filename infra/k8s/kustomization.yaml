# Youngsend Kustomization
# Lists all resources in dependency order for kubectl apply -k
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: youngsend

commonLabels:
  app.kubernetes.io/name: youngsend
  app.kubernetes.io/part-of: youngsend

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
