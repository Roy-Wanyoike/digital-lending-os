# Digital Lending OS Next.js HorizontalPodAutoscaler
# Dual-metric: CPU + Memory, plus custom requests_per_second

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: digital-lending-os-nextjs-hpa
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-nextjs
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: digital-lending-os-nextjs
  minReplicas: 3
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: requests_per_second
          selector:
            matchLabels:
              app.kubernetes.io/name: digital-lending-os-nextjs
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min
