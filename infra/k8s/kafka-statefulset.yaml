# Digital Lending OS Kafka 3-broker + 3-node Zookeeper StatefulSet

---
# Zookeeper Service
apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-zookeeper-headless
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-zookeeper
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: 2181
      targetPort: client
    - name: election
      port: 3888
      targetPort: election
    - name: leader
      port: 2888
      targetPort: leader
  selector:
    app.kubernetes.io/name: digital-lending-os-zookeeper
---
apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-zookeeper
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-zookeeper
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2181
      targetPort: client
  selector:
    app.kubernetes.io/name: digital-lending-os-zookeeper
---
# Zookeeper StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: digital-lending-os-zookeeper
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-zookeeper
    app.kubernetes.io/component: coordination
spec:
  serviceName: digital-lending-os-zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: digital-lending-os-zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digital-lending-os-zookeeper
        app.kubernetes.io/component: coordination
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: digital-lending-os-zookeeper
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - name: client
              containerPort: 2181
              protocol: TCP
            - name: leader
              containerPort: 2888
              protocol: TCP
            - name: election
              containerPort: 3888
              protocol: TCP
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_INIT_LIMIT
              value: "5"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "2"
            - name: ZOOKEEPER_SERVER_CNXN_FACTORY
              value: "org.apache.zookeeper.server.NettyServerCnxnFactory"
            - name: ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL
              value: "24"
            - name: ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT
              value: "3"
            - name: ZOOKEEPER_DATA_DIR
              value: /var/lib/zookeeper/data
            - name: ZOOKEEPER_LOG_DIR
              value: /var/lib/zookeeper/log
            - name: ZOOKEEPER_QUORUM_LISTEN_ON_ALL_IPS
              value: "true"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | nc localhost 2181 | grep imok
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | nc localhost 2181 | grep imok
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard-rwo

---
# Kafka Headless Service
apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-kafka-headless
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: broker
      port: 9092
      targetPort: broker
    - name: controller
      port: 9093
      targetPort: controller
  selector:
    app.kubernetes.io/name: digital-lending-os-kafka
---
# Kafka Service
apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-kafka-bootstrap
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-kafka
spec:
  type: ClusterIP
  ports:
    - name: broker
      port: 9092
      targetPort: broker
  selector:
    app.kubernetes.io/name: digital-lending-os-kafka
---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: digital-lending-os-kafka
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-kafka
    app.kubernetes.io/component: messaging
spec:
  serviceName: digital-lending-os-kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: digital-lending-os-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digital-lending-os-kafka
        app.kubernetes.io/component: messaging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9404"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: digital-lending-os-kafka
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-zookeeper
          image: confluentinc/cp-kafka:7.6.0
          command:
            - /bin/bash
            - -c
            - |
              for i in 0 1 2; do
                until echo ruok | nc digital-lending-os-zookeeper-${i}.digital-lending-os-zookeeper-headless.digital-lending-os-prod.svc.cluster.local 2181 | grep imok; do
                  echo "Waiting for zookeeper-${i}..."
                  sleep 2
                done
              done
              echo "All Zookeeper nodes are ready"
      containers:
        - name: kafka-broker
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - name: broker
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['apps.kubernetes.io/pod-index']
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['apps.kubernetes.io/pod-index']
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: CLUSTER_ID
              value: "digital-lending-os-kafka-cluster-001"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(hostname).digital-lending-os-kafka-headless.digital-lending-os-prod.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@digital-lending-os-kafka-0.digital-lending-os-kafka-headless.digital-lending-os-prod.svc.cluster.local:9093,1@digital-lending-os-kafka-1.digital-lending-os-kafka-headless.digital-lending-os-prod.svc.cluster.local:9093,2@digital-lending-os-kafka-2.digital-lending-os-kafka-headless.digital-lending-os-prod.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_NUM_PARTITIONS
              value: "12"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "300000"
            - name: KAFKA_LOG_CLEANER_ENABLE
              value: "true"
            - name: KAFKA_COMPRESSION_TYPE
              value: "lz4"
            - name: KAFKA_JMX_PORT
              value: "9404"
            - name: KAFKA_JMX_HOSTNAME
              value: "localhost"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "digital-lending-os-zookeeper-0.digital-lending-os-zookeeper-headless.digital-lending-os-prod.svc.cluster.local:2181,digital-lending-os-zookeeper-1.digital-lending-os-zookeeper-headless.digital-lending-os-prod.svc.cluster.local:2181,digital-lending-os-zookeeper-2.digital-lending-os-zookeeper-headless.digital-lending-os-prod.svc.cluster.local:2181"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard-rwo
