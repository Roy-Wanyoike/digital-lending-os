# Digital Lending OS Next.js Service and Ingress

apiVersion: v1
kind: Service
metadata:
  name: digital-lending-os-nextjs
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os-nextjs
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: digital-lending-os-nextjs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digital-lending-os-ingress
  namespace: digital-lending-os-prod
  labels:
    app.kubernetes.io/name: digital-lending-os
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: digital-lending-os-prod-ip
    networking.gke.io/managed-certificates: digital-lending-os-prod-cert
    networking.gke.io/v1beta1.FrontendConfig: digital-lending-os-frontend-config
spec:
  tls:
    - hosts:
        - digital-lending-os.io
        - www.digital-lending-os.io
      secretName: digital-lending-os-tls
  rules:
    - host: digital-lending-os.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: digital-lending-os-nextjs
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-lending-os-nextjs
                port:
                  number: 3000
    - host: www.digital-lending-os.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: digital-lending-os-nextjs
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digital-lending-os-nextjs
                port:
                  number: 3000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: digital-lending-os-prod-cert
  namespace: digital-lending-os-prod
spec:
  domains:
    - digital-lending-os.io
    - www.digital-lending-os.io
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: digital-lending-os-frontend-config
  namespace: digital-lending-os-prod
spec:
  sslPolicy: digital-lending-os-ssl-policy
  redirectToHttps:
    enabled: true
  defaultTimeoutSeconds: 30
