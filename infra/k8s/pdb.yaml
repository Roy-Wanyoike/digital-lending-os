# Digital Lending OS Pod Disruption Budget
# Ensures at least 1 pod remains available during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: digital-lending-os-pdb
  namespace: digital-lending-os
  labels:
    app: digital-lending-os
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: digital-lending-os
