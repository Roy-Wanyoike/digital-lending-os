# Youngsend Pod Disruption Budget
# Ensures at least 1 pod remains available during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: youngsend-pdb
  namespace: youngsend
  labels:
    app: youngsend
    app.kubernetes.io/name: youngsend
    app.kubernetes.io/part-of: youngsend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: youngsend
