# Youngsend ConfigMap — non-sensitive application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: youngsend-config
  namespace: youngsend
  labels:
    app.kubernetes.io/name: youngsend
    app.kubernetes.io/part-of: youngsend
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  DB_PROVIDER: "postgresql"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_BROKERS: "kafka:9092"
  OPENSEARCH_URL: "https://opensearch:9200"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "youngsend-api"
