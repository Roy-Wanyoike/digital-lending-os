# Digital Lending OS Kubernetes Secret
# DO NOT commit actual secrets to version control.
# Create secrets externally via a secrets manager (e.g., Vault, AWS Secrets Manager)
# or directly with kubectl:
#
#   kubectl create secret generic digital-lending-os-secret \
#     --from-literal=DATABASE_POSTGRESQL_URL=<postgresql://user:pass@host:5432/digital-lending-os> \
#     --from-literal=NEXTAUTH_SECRET=<generated-with-openssl-rand-base64-32> \
#     --from-literal=OPENSEARCH_USERNAME=<username> \
#     --from-literal=OPENSEARCH_PASSWORD=<password> \
#     -n digital-lending-os
#
# Set via: kubectl create secret generic digital-lending-os-secret --from-literal=POSTGRES_PASSWORD=<actual-password>

apiVersion: v1
kind: Secret
metadata:
  name: digital-lending-os-secret
  namespace: digital-lending-os
  labels:
    app.kubernetes.io/name: digital-lending-os
    app.kubernetes.io/part-of: digital-lending-os
type: Opaque
data:
  # DATABASE_POSTGRESQL_URL:  # Set via kubectl --from-literal=DATABASE_POSTGRESQL_URL=<postgresql://user:pass@host:5432/digital-lending-os>
  # NEXTAUTH_SECRET:          # Set via kubectl --from-literal=NEXTAUTH_SECRET=<generated-with-openssl-rand-base64-32>
  # OPENSEARCH_USERNAME:      # Set via kubectl --from-literal=OPENSEARCH_USERNAME=<username>
  # OPENSEARCH_PASSWORD:      # Set via kubectl --from-literal=OPENSEARCH_PASSWORD=<password>
