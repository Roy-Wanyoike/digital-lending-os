# ─────────────────────────────────────────────────────────────────────
# Digital Lending OS — Security Headers
# Include this snippet inside server blocks that serve the app.
# ─────────────────────────────────────────────────────────────────────

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Block MIME-type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable browser XSS filter (legacy; modern browsers ignore but harmless)
add_header X-XSS-Protection "1; mode=block" always;

# Enforce HTTPS for 2 years (HSTS)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Control referrer information leakage
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict access to camera, microphone, and geolocation
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
