# ─────────────────────────────────────────────────────────────────────
# Youngsend — Proxy Parameters
# Include this snippet inside every location block that proxies to
# the upstream Next.js application.
# ─────────────────────────────────────────────────────────────────────

proxy_http_version 1.1;

# Pass original Host header so Next.js can match the domain
proxy_set_header Host              $host;

# Actual client IP (from the direct connection)
proxy_set_header X-Real-IP        $remote_addr;

# Full proxy chain IP list
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# Tell the app whether the original request was HTTP or HTTPS
proxy_set_header X-Forwarded-Proto $scheme;

# WebSocket / SSE upgrade support
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection "upgrade";
