# ─────────────────────────────────────────────────────────────────────
# Digital Lending OS — Nginx Reverse Proxy Configuration
# Domain: digitallendingos.co.ke
# Upstream: Next.js standalone on port 3000
# ─────────────────────────────────────────────────────────────────────

worker_processes auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# ── Events ──────────────────────────────────────────────────────────
events {
    worker_connections 2048;
    multi_accept on;
}

# ── HTTP ────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream_addr=$upstream_addr '
                    'request_time=$request_time '
                    'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ── Performance tuning ───────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # ── Gzip compression ────────────────────────────────────────────
    gzip         on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/rss+xml
        image/svg+xml;

    gzip_vary on;
    gzip_proxied any;

    # ── Upstream (Next.js app) ──────────────────────────────────────
    # Use "app:3000" inside Docker Compose, "127.0.0.1:3000" standalone
    upstream digital_lending_os {
        server app:3000;
    }

    # ── Rate-limiting zones (optional, disabled by default) ─────────
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Body size limit ────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Server block ───────────────────────────────────────────────
    server {
        listen 80;
        server_name digitallendingos.co.ke;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name digitallendingos.co.ke;

        # ── TLS certificates ────────────────────────────────────────
        ssl_certificate      /etc/nginx/ssl/cert.pem;
        ssl_certificate_key  /etc/nginx/ssl/key.pem;

        # ── TLS protocol & cipher hardening ────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # ── TLS session caching ────────────────────────────────────
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # ── OCSP stapling (enable when using real certs) ───────────
        # ssl_stapling             on;
        # ssl_stapling_verify      on;
        # resolver                 8.8.8.8 8.8.4.4 valid=300s;

        # ── Security headers (reusable snippet) ───────────────────
        include /etc/nginx/snippets/security-headers.conf;

        # ── Static asset caching ──────────────────────────────────
        location /_next/static/ {
            proxy_pass http://digital_lending_os;

            # Long cache for hashed Next.js static assets
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            include /etc/nginx/snippets/proxy-params.conf;
        }

        # ── Health endpoint (short cache) ─────────────────────────
        location /api/health {
            proxy_pass http://digital_lending_os;

            expires 10s;
            add_header Cache-Control "no-cache";

            include /etc/nginx/snippets/proxy-params.conf;
        }

        # ── Default: proxy everything else to Next.js ──────────────
        location / {
            proxy_pass http://digital_lending_os;

            include /etc/nginx/snippets/proxy-params.conf;
        }
    }
}
