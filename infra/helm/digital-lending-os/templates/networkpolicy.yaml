{{- if .Values.networkPolicy.enabled -}}
---
# Default deny all ingress and egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-deny-all
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from ingress-nginx namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-ingress
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
---
# Allow egress to PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-postgresql
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# Allow egress to Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-redis
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
# Allow egress to Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-kafka
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Allow egress to OpenSearch
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-opensearch
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
---
# Allow egress to OTel Collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-otel
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "digital-lending-os.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4317
---
# Allow DNS egress (required for service discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-allow-dns
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
