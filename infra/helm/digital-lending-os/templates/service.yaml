apiVersion: v1
kind: Service
metadata:
  name: {{ include "digital-lending-os.fullname" . }}-svc
  labels:
    {{- include "digital-lending-os.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
  selector:
    {{- include "digital-lending-os.selectorLabels" . | nindent 4 }}
