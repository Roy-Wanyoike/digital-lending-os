# Development environment values
# Usage: helm install digital-lending-os ./infra/helm/digital-lending-os -f values-dev.yaml

replicaCount: 1

image:
  repository: ghcr.io/roy-wanyoike/digital-lending-os
  pullPolicy: Always
  tag: dev-latest

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: digitallendingos.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  DB_PROVIDER: postgresql
  NODE_ENV: development
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  REDIS_URL: redis://redis-dev:6379/0
  KAFKA_BROKERS: kafka-dev:9092
  OPENSEARCH_URL: https://opensearch-dev:9200
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-dev:4317
  OTEL_SERVICE_NAME: digital-lending-os-api-dev
  LOG_LEVEL: debug

secrets: {}

healthcheck:
  livenessInitialDelay: 10
  readinessInitialDelay: 3

pdb:
  enabled: false

networkPolicy:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
