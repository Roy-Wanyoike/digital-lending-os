{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "youngsend.fullname" . }}-pdb
  labels:
    {{- include "youngsend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "youngsend.selectorLabels" . | nindent 6 }}
{{- end }}
