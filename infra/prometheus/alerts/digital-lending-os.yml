groups:
  - name: dlo-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} requests/sec (> 0.1 threshold)"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P99 latency detected"
          description: "P99 latency is {{ $value }}ms (> 2000ms threshold)"

      - alert: HighMemory
        expr: |
          container_memory_usage_bytes > 450 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Container memory usage is {{ $value }} bytes (> 450MB threshold)"

      - alert: PodCrashLoopBackOff
        expr: |
          increase(kube_pod_container_status_restarts_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod crash loop detected"
          description: "Container has restarted {{ $value }} times in the last 5 minutes"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_database_numbackends_max / pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Connection pool usage is above 90% of max connections"
