# ─────────────────────────────────────────────────────────────────────
# OpenTelemetry Collector — Digital Lending OS Docker Compose Stack
# Receives OTLP from app, exports traces to Jaeger, metrics to Prometheus
# ─────────────────────────────────────────────────────────────────────

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 5s
    limit_mib: 512

exporters:
  jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  logging:
    verbosity: basic

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
