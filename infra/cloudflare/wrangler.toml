# ─── Youngsend Edge Worker — Wrangler Configuration ──────────────
# Deploy with: wrangler deploy --env production
# Local dev:    wrangler dev --env staging

name = "youngsend-edge"
main = "worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Worker placement: route all traffic through the edge
# The worker acts as a reverse proxy to the Next.js origin

# ─── KV Namespace Bindings ───────────────────────────────────────
# Used for: rate limiting sliding windows, A/B test assignments,
# edge-side session hints, and purge token storage.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"
preview_id = "YOUR_PREVIEW_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_CACHE_KV_ID"
preview_id = "YOUR_PREVIEW_CACHE_KV_ID"

[[kv_namespaces]]
binding = "AB_TEST_KV"
id = "YOUR_AB_TEST_KV_ID"
preview_id = "YOUR_PREVIEW_AB_TEST_KV_ID"

# ─── Environment: Staging ──────────────────────────────────────
[env.staging]
name = "youngsend-edge-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_STAGING_RATE_LIMIT_KV_ID"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_STAGING_CACHE_KV_ID"

[[env.staging.kv_namespaces]]
binding = "AB_TEST_KV"
id = "YOUR_STAGING_AB_TEST_KV_ID"

[env.staging.routes]
pattern = "staging.youngsend.com/*"
zone_id = "YOUR_STAGING_ZONE_ID"

# ─── Environment: Production ────────────────────────────────────
[env.production]
name = "youngsend-edge-production"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_PRODUCTION_RATE_LIMIT_KV_ID"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "YOUR_PRODUCTION_CACHE_KV_ID"

[[env.production.kv_namespaces]]
binding = "AB_TEST_KV"
id = "YOUR_PRODUCTION_AB_TEST_KV_ID"

[env.production.routes]
pattern = "youngsend.com/*"
zone_id = "YOUR_PRODUCTION_ZONE_ID"

[env.production.routes]
pattern = "www.youngsend.com/*"
zone_id = "YOUR_PRODUCTION_ZONE_ID"

[env.production.routes]
pattern = "app.youngsend.com/*"
zone_id = "YOUR_PRODUCTION_ZONE_ID"

# ─── Build Configuration ─────────────────────────────────────────
[build]
command = "npx tsc --noEmit"

# ─── Static Assets (for wrangler assets) ────────────────────────
# Not used directly — static assets are served from origin through
# the worker's cache-first strategy.

# ─── Observability ──────────────────────────────────────────────
# Workers Logpush is configured via the Cloudflare dashboard
# to forward logs to our OTel Collector (Grafana Loki).

# [observability]
# enabled = true
# head_sampling_rate = 0.1

# ─── Limits & Quotas ─────────────────────────────────────────────
# Script size:       1 MB (compressed)
# KV reads:          100,000/day (free tier)
# KV writes:         1,000/day (free tier)
# Subrequest limit:  50 per request
# CPU time:          30s (paid), 10ms (free)
