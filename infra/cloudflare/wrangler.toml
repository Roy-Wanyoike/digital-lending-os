# ─── Youngsend Edge Worker — Wrangler Configuration ──────────────
# Deploy with: cd infra/cloudflare && npx wrangler deploy --env production
# Local dev:    cd infra/cloudflare && npx wrangler dev --env staging

name = "youngsend-edge"
main = "worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker placement: route all traffic through the edge.
# The worker acts as a reverse proxy to the Next.js origin.

# ─── KV Namespace Bindings ───────────────────────────────────────
# Used for: rate limiting sliding windows.

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_RATE_LIMIT_KV_ID"
preview_id = "YOUR_PREVIEW_RATE_LIMIT_KV_ID"

# ─── Environment Variables ───────────────────────────────────────

[vars]
ENVIRONMENT = "production"
ORIGIN_URL = "https://youngsend.space-z.ai"
ALLOWED_ORIGINS = "https://youngsend.space-z.ai,https://www.youngsend.space-z.ai"
ALLOWED_COUNTRIES = ""  # Empty = allow all. Set e.g. "US,GB,KE,NG,UG,TZ" to restrict.
LOG_LEVEL = "info"

# ─── Environment: Staging ──────────────────────────────────────
[env.staging]
name = "youngsend-edge-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ORIGIN_URL = "https://staging.youngsend.space-z.ai"
ALLOWED_ORIGINS = "https://staging.youngsend.space-z.ai"
ALLOWED_COUNTRIES = ""
LOG_LEVEL = "debug"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_STAGING_RATE_LIMIT_KV_ID"

[env.staging.routes]
pattern = "staging.youngsend.space-z.ai/*"
zone_id = "YOUR_STAGING_ZONE_ID"

# ─── Environment: Production ────────────────────────────────────
[env.production]
name = "youngsend-edge-production"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "YOUR_PRODUCTION_RATE_LIMIT_KV_ID"

[env.production.routes]
pattern = "youngsend.space-z.ai/*"
zone_id = "YOUR_PRODUCTION_ZONE_ID"

[env.production.routes]
pattern = "www.youngsend.space-z.ai/*"
zone_id = "YOUR_PRODUCTION_ZONE_ID"

# ─── Secrets (set via `wrangler secret put <NAME>`)
#   JWT_PUBLIC_KEY  — RSA public key PEM for JWT signature verification
# ─── Build Configuration ─────────────────────────────────────────
[build]
command = "npx tsc --noEmit"

# ─── Limits & Quotas ─────────────────────────────────────────────
# Script size:       1 MB (compressed)
# KV reads:          100,000/day (free tier)
# KV writes:         1,000/day (free tier)
# Subrequest limit:  50 per request
# CPU time:          30s (paid), 10ms (free)
